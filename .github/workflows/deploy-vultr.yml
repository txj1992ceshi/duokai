name: Deploy Vultr

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact 40-character SHA currently at origin/main.'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_VULTR to authorize this manual production deployment.'
        required: true
        type: string

concurrency:
  group: deploy-vultr-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment control files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate manual deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY_VULTR" ]; then
            echo "confirmation must be exactly DEPLOY_VULTR" >&2
            exit 1
          fi
          EXPECTED_SHA="${{ github.event.inputs.expected_sha }}"
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "expected_sha must be an exact lowercase 40-character Git SHA" >&2
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "origin/main moved: expected $EXPECTED_SHA, checked out $ACTUAL_SHA" >&2
            exit 1
          fi

      - name: Deploy exact main SHA over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: ${{ secrets.VULTR_PORT || '22' }}
          envs: VULTR_ROOT_DIR,PUBLIC_SCHEME,PUBLIC_HOST,EXTRA_CORS_ORIGINS
          command_timeout: 45m
          capture_stdout: true
          script: |
            set -euo pipefail
            cd "${VULTR_ROOT_DIR:-/var/www/duokai}"
            BRANCH=main \
            EXPECTED_SHA="${{ github.event.inputs.expected_sha }}" \
            PUBLIC_SCHEME="${PUBLIC_SCHEME:-http}" \
            PUBLIC_HOST="${PUBLIC_HOST}" \
            EXTRA_CORS_ORIGINS="${EXTRA_CORS_ORIGINS:-}" \
            bash deploy/update-from-git.sh
    env:
      VULTR_ROOT_DIR: ${{ secrets.VULTR_ROOT_DIR }}
      PUBLIC_SCHEME: ${{ secrets.VULTR_PUBLIC_SCHEME }}
      PUBLIC_HOST: ${{ secrets.VULTR_PUBLIC_HOST }}
      EXTRA_CORS_ORIGINS: ${{ secrets.VULTR_EXTRA_CORS_ORIGINS }}
